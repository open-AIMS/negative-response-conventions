# The bayesnec the study is run against.
#
# The container holds the toolchain and not the package (see hpc/README.md), so
# the job installs bayesnec from source at start-up and this file is what says
# which source. hpc/deploy.sh exports this commit from a local checkout and
# copies it into the job directory; the job refuses to run if what it installed
# does not report the version below.
#
# Changing this is a change to the study. Every fit in results/ was produced by
# the commit recorded here, and the priors in priors/ were derived from it.
commit: 9269bf6d040972d444bf74e3c904aa269d14ce48
version: 2.1.3.35
branch: dev
# What this commit brings that the previous run (25466e53) did not, and why the
# study is being re-run rather than extended:
#   #326  nsec() discarded the draws whose NSEC is the control concentration,
#         biasing the lower bound of every fit. This is the only change that
#         alters a reported number.
#   #336  the initial-value search no longer reseeds from the clock when no seed
#         is supplied. Every fit here supplies one, so this changes nothing.
#   #334  crf() resolves its model argument in the formula's own environment.
#         Every arm passes a literal, so this changes nothing.
#
# Verified rather than assumed, on 2026-09-14: the 42 fixed priors are identical
# between 25466e53 and this commit, so the Stan source and the compile cache are
# unchanged; and refitting p1/measured/iteration 1 under both gives an identical
# ErC10, ErC50 and per-equation weight vector, with only the NSEC moving (point
# -0.0121, lower bound -0.0423).
#
# Results from before this commit are not comparable for the NSEC and are not
# mixed with it.
